{# Delete confirmation: native popover, no JavaScript needed. #}
<button type="button"
        class="ab-btn ab-btn-quiet ab-btn-danger"
        popovertarget="delete-education-{{ edu.id }}"
        aria-label="Delete {{ edu.institution }}">
    Scrub
</button>
<div id="delete-education-{{ edu.id }}"
     class="ab-confirm"
     popover="auto"
     role="alertdialog"
     aria-modal="true"
     aria-labelledby="delete-education-title-{{ edu.id }}"
     aria-describedby="delete-education-desc-{{ edu.id }}">
    <div class="ab-confirm-panel">
        <p class="ab-confirm-code">TR-DEL &middot; Irreversible</p>
        <h2 class="ab-confirm-title" id="delete-education-title-{{ edu.id }}">Scrub this rating?</h2>
        <p class="ab-confirm-desc" id="delete-education-desc-{{ edu.id }}">
            <strong>{{ edu.institution }}</strong> will be removed from the record. This can't be undone.
        </p>
        <div class="ab-confirm-actions">
            <button type="button"
                    class="ab-btn ab-btn-quiet"
                    popovertarget="delete-education-{{ edu.id }}"
                    popovertargetaction="hide">Abort</button>
            <form method="post" action="{% url 'main:delete_education' edu.id %}">
                {% csrf_token %}
                <button type="submit" class="ab-btn ab-btn-alarm">Scrub rating</button>
            </form>
        </div>
    </div>
</div>

{# Delete confirmation: native popover, no JavaScript needed. #}
<button type="button"
        class="ab-btn ab-btn-quiet ab-btn-danger"
        popovertarget="delete-award-{{ award.id }}"
        aria-label="Delete {{ award.title }}">
    Scrub
</button>
<div id="delete-award-{{ award.id }}"
     class="ab-confirm"
     popover="auto"
     role="alertdialog"
     aria-modal="true"
     aria-labelledby="delete-award-title-{{ award.id }}"
     aria-describedby="delete-award-desc-{{ award.id }}">
    <div class="ab-confirm-panel">
        <p class="ab-confirm-code">CIT-DEL &middot; Irreversible</p>
        <h2 class="ab-confirm-title" id="delete-award-title-{{ award.id }}">Strip this ribbon?</h2>
        <p class="ab-confirm-desc" id="delete-award-desc-{{ award.id }}">
            <strong>{{ award.title }}</strong> and its citation will be removed. This can't be undone.
        </p>
        <div class="ab-confirm-actions">
            <button type="button"
                    class="ab-btn ab-btn-quiet"
                    popovertarget="delete-award-{{ award.id }}"
                    popovertargetaction="hide">Abort</button>
            <form method="post" action="{% url 'main:delete_award' award.id %}">
                {% csrf_token %}
                <button type="submit" class="ab-btn ab-btn-alarm">Strip ribbon</button>
            </form>
        </div>
    </div>
</div>

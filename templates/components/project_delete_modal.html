{# Delete confirmation: native popover, no JavaScript needed. #}
<button type="button"
        class="ab-btn ab-btn-quiet ab-btn-danger"
        popovertarget="delete-project-{{ project.id }}"
        aria-label="Delete {{ project.title }}">
    Scrap
</button>
<div id="delete-project-{{ project.id }}"
     class="ab-confirm"
     popover="auto"
     role="alertdialog"
     aria-modal="true"
     aria-labelledby="delete-project-title-{{ project.id }}"
     aria-describedby="delete-project-desc-{{ project.id }}">
    <div class="ab-confirm-panel">
        <p class="ab-confirm-code">AF-DEL &middot; Irreversible</p>
        <h2 class="ab-confirm-title" id="delete-project-title-{{ project.id }}">Scrap this airframe?</h2>
        <p class="ab-confirm-desc" id="delete-project-desc-{{ project.id }}">
            <strong>{{ project.title }}</strong> will be removed from the hangar. This can't be undone.
        </p>
        <div class="ab-confirm-actions">
            <button type="button"
                    class="ab-btn ab-btn-quiet"
                    popovertarget="delete-project-{{ project.id }}"
                    popovertargetaction="hide">Abort</button>
            <form method="post" action="{% url 'main:delete_project' project.id %}">
                {% csrf_token %}
                <button type="submit" class="ab-btn ab-btn-alarm">Scrap airframe</button>
            </form>
        </div>
    </div>
</div>
